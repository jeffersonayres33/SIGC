name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build project
        run: |
          npm run build
          touch dist/.nojekyll
          if [ -f public/404.html ] && [ ! -f dist/404.html ]; then
            cp public/404.html dist/404.html
          fi
        env:
          VITE_SUPABASE_URL: https://ajcdrtsdozbjvsdyhdly.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqY2RydHNkb3pianZzZHloZGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTg4MTMsImV4cCI6MjEwNTY5NDgxM30.c3xptttpKoQbWQJRY5B4XYLjzM3iH2kB3D91BOzHga8

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
